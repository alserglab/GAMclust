url: https://github.com/alserglab/GAMclust

template:
  bootstrap: 5
  bootswatch: flatly

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: "Get started"
      href: articles/GAMclust_tutorial_BULK.html
    reference:
      text: "Reference"
      href: reference/index.html
    articles:
      text: "Articles"
      menu:
        - text: "Bulk RNA-Seq"
          href: articles/GAMclust_tutorial_BULK.html
        - text: "Single-Cell Transcriptomics"
          href: articles/GAMclust_tutorial_SC.html
        - text: "Spatial Transcriptomics"
          href: articles/GAMclust_tutorial_SPAT.html
        - text: "---"
        - text: "All articles"
          href: articles/index.html

articles:
  - title: "Bulk RNA-Seq Analysis"
    desc: "Step-by-step guide for running the GAMclust pipeline on bulk RNA-seq data."
    contents:
      - GAMclust_tutorial_BULK

  - title: "Single-Cell RNA-Seq Analysis"
    desc: "Step-by-step guide for running the GAMclust pipeline on single-cell RNA-seq data."
    contents:
      - GAMclust_tutorial_SC

  - title: "Spatial RNA-Seq Analysis"
    desc: "Step-by-step guide for running the GAMclust pipeline on spatial RNA-seq data."
    contents:
      - GAMclust_tutorial_SPAT

reference:
  - title: "Data Preparation & Clustering"
    desc: "Core functions for configuring networks and executing the main GAMclust algorithms."
    contents:
      - prepareData
      - prepareNetwork
      - preClustering
      - gamClustering
      - seq_batch_solver
  - title: "Visualization & Downstream Analysis"
    desc: "Functions for exploring network graphs, generating annotation tables, and plotting heatmaps."
    contents:
      - getAnnotationHeatmap
      - getAnnotationTables
      - getGeneTables
      - getGraphs
      - modulesSimilarity
